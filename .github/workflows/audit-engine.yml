name: Independent Evidence Engine
on:
  push:
    paths:
      - "audit-engine/**"
      - ".github/workflows/audit-engine.yml"
  pull_request:
    paths:
      - "audit-engine/**"
      - ".github/workflows/audit-engine.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run verify:fixture
      - run: npm run verify:aggregate-fixture
